name: Review health example

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: tenpace-app/review-router-audit@v1
        id: audit
      - uses: actions/upload-artifact@v7
        with:
          name: review-health-example
          path: ${{ steps.audit.outputs.report-path }}
